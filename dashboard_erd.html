<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  USERS ||--o{ JOBS : creates
  USERS ||--o{ PRODUCTION_RUNS : logs
  USERS ||--o{ STOCK_MOVEMENTS : records
  USERS ||--o{ ORDERS : creates
  ORDERS ||--o{ JOBS : produces
  JOBS ||--o{ PRODUCTION_RUNS : has
  PRODUCTION_RUNS ||--o{ PRODUCTION_RUN_MATERIALS : consumes
  INVENTORY_ITEMS ||--o{ PRODUCTION_RUN_MATERIALS : "consumed as"
  INVENTORY_ITEMS ||--o{ STOCK_MOVEMENTS : tracks
  CUSTOMERS ||--o{ ORDERS : places
  ORDERS ||--o{ ORDER_LINE_ITEMS : contains
  INVENTORY_ITEMS ||--o{ ORDER_LINE_ITEMS : "referenced as finished good"

  USERS {
    uuid id PK
    string name
    string email
    string role
  }
  JOBS {
    uuid id PK
    uuid order_id FK
    uuid created_by FK
    string description
    int target_quantity
    string status
    date target_completion_date
    int version
  }
  PRODUCTION_RUNS {
    uuid id PK
    uuid job_id FK
    uuid logged_by FK
    int quantity_produced
    date run_date
  }
  PRODUCTION_RUN_MATERIALS {
    uuid id PK
    uuid production_run_id FK
    uuid item_id FK
    decimal quantity_consumed
  }
  INVENTORY_ITEMS {
    uuid id PK
    string name
    string item_type
    string unit_of_measure
    decimal low_stock_threshold
  }
  STOCK_MOVEMENTS {
    uuid id PK
    uuid item_id FK
    uuid recorded_by FK
    string movement_type
    decimal quantity
    string reference_type
    uuid reference_id
    timestamp recorded_at
  }
  CUSTOMERS {
    uuid id PK
    string name
    string contact_info
  }
  ORDERS {
    uuid id PK
    uuid customer_id FK
    uuid created_by FK
    string status
    date requested_delivery_date
    int version
  }
  ORDER_LINE_ITEMS {
    uuid id PK
    uuid order_id FK
    uuid finished_good_id FK
    int quantity
    string spec_notes
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
